version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: finpilot_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: finpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot_user -d finpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finpilot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: expense-manager-1-backend:latest
    container_name: finpilot-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://finpilot_user:supersecretpassword@postgres:5432/finpilot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: expense-manager-1-backend:latest
    container_name: finpilot-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://finpilot_user:supersecretpassword@postgres:5432/finpilot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
